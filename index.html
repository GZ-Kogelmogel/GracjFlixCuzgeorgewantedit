<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracj Flix</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
}

/* background */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, rgba(255,0,0,0.15), transparent 60%);
  z-index: -1;
}

/* screens */
.screen {
  min-height: 100dvh;
  width: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 20px;
}

#login { display: flex; }

.brand {
  font-size: clamp(28px, 6vw, 46px);
  font-weight: 800;
  margin-bottom: 30px;
  letter-spacing: 2px;
  color: #e50914;
  text-align: center;
}

/* login profile */
.profile {
  text-align: center;
  cursor: pointer;
}

.pfp {
  width: 90px;
  height: 90px;
  border-radius: 10px;
  border: 2px solid #e50914;
}

.label {
  margin-top: 10px;
  opacity: 0.8;
}

/* HOME GRID (this is the glow-up) */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 1000px;
  padding: 10px;
}

.card {
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 14px;
  border: 1px solid rgba(255,0,0,0.25);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: 0.2s ease;
  padding: 10px;
}

.card h1 {
  font-size: 16px;
}

.card:active {
  transform: scale(0.97);
}

.card:hover {
  transform: scale(1.03);
  border-color: rgba(255,0,0,0.6);
}

/* PLAYER */
.topbar {
  width: 100%;
  max-width: 1000px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  gap: 10px;
}

.backbtn {
  cursor: pointer;
  padding: 10px 14px;
  border: 1px solid rgba(255,0,0,0.3);
  border-radius: 8px;
  flex-shrink: 0;
}

.frame {
  width: 100%;
  max-width: 1000px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,0,0,0.25);
}

/* RESPONSIVE IFRAME (no more fixed 600px nonsense 💀) */
iframe {
  width: 100%;
  height: 60vh;
  min-height: 300px;
  border: none;
}

/* small phones tweaks */
@media (max-width: 480px) {
  .card {
    height: 140px;
  }

  .card h1 {
    font-size: 14px;
  }

  iframe {
    height: 55vh;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- LOGIN -->
<div class="screen" id="login">
  <div class="brand">GRACJ FLIX</div>

  <div class="profile" onclick="goHome()">
    <img class="pfp" src="c.png">
    <div class="label">Gracj</div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="home">
  <div class="grid">

    <div class="card" onclick="openShow('young')"><h1>Young Gracj</h1></div>
    <div class="card" onclick="openShow('happy1')"><h1>Happy Gracj 1</h1></div>
    <div class="card" onclick="openShow('happy2')"><h1>Happy Gracj 2</h1></div>
    <div class="card" onclick="openShow('whos')"><h1>In Whose Gracj</h1></div>
    <div class="card" onclick="openShow('american')"><h1>American Gracj</h1></div>
    <div class="card" onclick="openShow('stranger')"><h1>Stranger Gracj</h1></div>
    <div class="card" onclick="openShow('adole')"><h1>Adolegracj</h1></div>

  </div>
</div>

<!-- PLAYER -->
<div class="screen" id="player">

  <div class="topbar">
    <div id="title">NOW PLAYING</div>
    <div class="backbtn" onclick="goHomeAndPause()">← Back</div>
  </div>

  <div class="frame">
    <iframe id="frame" allowfullscreen></iframe>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'flex';
}

function goHome(){
  show('home');
}

function goHomeAndPause(){
  document.getElementById("frame").src = "";
  show('home');
}

function openShow(type){
  const frame = document.getElementById("frame");
  const title = document.getElementById("title");

  const data = {
    young: ["https://www.vidking.net/embed/tv/71728/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true", "Young Gracj"],
    happy1: ["https://www.vidking.net/embed/movie/9614?color=e50914&autoPlay=true", "Happy Gracj 1"],
    happy2: ["https://www.vidking.net/embed/movie/1263256?color=e50914&autoPlay=true", "Happy Gracj 2"],
    whos: ["https://www.vidking.net/embed/movie/1381066?color=e50914&autoPlay=true", "In Whose Gracj"],
    american: ["https://www.vidking.net/embed/tv/1433/1/1?autoPlay=true&nextEpisode=true&episodeSelector=true", "American Gracj"],
    stranger: ["https://www.vidking.net/embed/tv/66732/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true", "Stranger Gracj"],
    adole: ["https://www.vidking.net/embed/tv/249042/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true", "Adolegracj"]
  };

  frame.src = data[type][0];
  title.innerText = "NOW PLAYING: " + data[type][1];

  show("player");
}
</script>

</body>
</html>
