<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracj Flix</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, rgba(255,0,0,0.15), transparent 60%);
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#login { display: flex; }

.brand {
  font-size: 46px;
  font-weight: 800;
  margin-bottom: 40px;
  letter-spacing: 3px;
  color: #e50914;
}

.profile {
  text-align: center;
  cursor: pointer;
}

.pfp {
  width: 120px;
  height: 120px;
  border-radius: 10px;
  border: 2px solid #e50914;
}

.label {
  margin-top: 10px;
  opacity: 0.8;
}

.grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  width: 200px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 14px;
  border: 1px solid rgba(255,0,0,0.25);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.06);
  border-color: rgba(255,0,0,0.6);
}

.topbar {
  width: 80%;
  max-width: 1000px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 12px;
}

.backbtn {
  cursor: pointer;
  padding: 8px 12px;
  border: 1px solid rgba(255,0,0,0.3);
  border-radius: 8px;
}

.frame {
  width: 80%;
  max-width: 1000px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,0,0,0.25);
}

iframe {
  width: 100%;
  height: 600px;
  border: none;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- LOGIN -->
<div class="screen" id="login">
  <div class="brand">GRACJ FLIX</div>

  <div class="profile" onclick="goHome()">
    <img class="pfp" src="c.png">
    <div class="label">Gracj</div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="home">

  <div class="grid">

    <div class="card" onclick="openShow('young')">
      <h1>Young Gracj</h1>
    </div>

    <div class="card" onclick="openShow('happy1')">
      <h1>Happy Gracj 1</h1>
    </div>

    <div class="card" onclick="openShow('happy2')">
      <h1>Happy Gracj 2</h1>
    </div>

    <div class="card" onclick="openShow('whos')">
      <h1>In Whose Gracj</h1>
    </div>

    <div class="card" onclick="openShow('american')">
      <h1>American Gracj</h1>
    </div>

    <div class="card" onclick="openShow('stranger')">
      <h1>Stranger Gracj</h1>
    </div>

    <div class="card" onclick="openShow('adole')">
      <h1>Adolegracj</h1>
    </div>

  </div>

</div>

<!-- PLAYER -->
<div class="screen" id="player">
  <div class="topbar">
    <div id="title">NOW PLAYING</div>
    <div class="backbtn" onclick="goHomeAndPause()">← Back</div>
  </div>

  <div class="frame">
    <iframe id="frame" allowfullscreen></iframe>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'flex';
}

function goHome(){
  show('home');
}

function goHomeAndPause(){
  document.getElementById("frame").src = "";
  show('home');
}

function openShow(type){
  const frame = document.getElementById("frame");
  const title = document.getElementById("title");

  if(type === "young"){
    frame.src = "https://www.vidking.net/embed/tv/71728/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true";
    title.innerText = "NOW PLAYING: Young Gracj";
  }

  if(type === "happy1"){
    frame.src = "https://www.vidking.net/embed/movie/9614?color=e50914&autoPlay=true";
    title.innerText = "NOW PLAYING: Happy Gracj 1";
  }

  if(type === "happy2"){
    frame.src = "https://www.vidking.net/embed/movie/1263256?color=e50914&autoPlay=true";
    title.innerText = "NOW PLAYING: Happy Gracj 2";
  }

  if(type === "whos"){
    frame.src = "https://www.vidking.net/embed/movie/1381066?color=e50914&autoPlay=true";
    title.innerText = "NOW PLAYING: In Whose Gracj";
  }

  if(type === "american"){
    frame.src = "https://www.vidking.net/embed/tv/1433/1/1?autoPlay=true&nextEpisode=true&episodeSelector=true";
    title.innerText = "NOW PLAYING: American Gracj";
  }

  if(type === "stranger"){
    frame.src = "https://www.vidking.net/embed/tv/66732/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true";
    title.innerText = "NOW PLAYING: Stranger Gracj";
  }

  if(type === "adole"){
    frame.src = "https://www.vidking.net/embed/tv/249042/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true";
    title.innerText = "NOW PLAYING: Adolegracj";
  }

  show("player");
}
</script>

</body>
</html>
